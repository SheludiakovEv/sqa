plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // JUnit 5
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Selenium: Подключаем строго ядро и Firefox, как написано в комментарии
    testImplementation 'org.seleniumhq.selenium:selenium-api:4.20.0'
    testImplementation 'org.seleniumhq.selenium:selenium-firefox-driver:4.20.0'

    // Точечное подключение только нужных браузеров
    testImplementation 'org.seleniumhq.selenium:selenium-api:4.20.0'
    testImplementation 'org.seleniumhq.selenium:selenium-chrome-driver:4.20.0'
    testImplementation 'org.seleniumhq.selenium:selenium-firefox-driver:4.20.0'
    testImplementation 'org.seleniumhq.selenium:selenium-safari-driver:4.20.0'
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.20.0'

    // Вспомогательные утилиты
    implementation 'org.jcommander:jcommander:1.83'
    implementation 'com.mysql:mysql-connector-j:9.7.0'
    implementation 'org.hibernate.orm:hibernate-core:6.6.1.Final'

    // Jackson 2.x: Используем BOM для автоматического выравнивания версий
    implementation platform('com.fasterxml.jackson:jackson-bom:2.17.1')
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
}

test {
    useJUnitPlatform()
    if(project.hasProperty("browser")){
        systemProperty("browser", project.property("browser"))
    }
    if(project.hasProperty("target")){
        systemProperty("target", project.property("target"))
    }
}